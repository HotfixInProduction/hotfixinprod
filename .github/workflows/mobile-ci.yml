name: Mobile App CI

on:
  push:
    branches: [main, dev, "**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # Clear any restored npm cache corruption that can trigger EEXIST during npm ci on GitHub-hosted runners
      - name: Clean npm cache
        run: rm -rf ~/.npm/_cacache

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx expo-doctor

      # Unit tests + coverage
      - run: npm run test:coverage

      # Upload coverage to Codecov
      - uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          files: mobile/coverage/lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Upload test results to Codecov Test Analytics
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@47f89e9acb64b76debcd5ea40642d25a4adced9f # v1.1.1
        with:
          files: mobile/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-ios:
    needs: validate
    runs-on: macos-14
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Install dependencies
        run: npm ci

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}

      - name: Debug Workspace
        run: ls -R ios

      - name: Build App
        run: npx detox build -c ios.sim.release
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}

      - name: Run E2E Tests
        run: npx detox test -c ios.sim.release --cleanup --loglevel trace
        env:
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}

      - name: Upload Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: mobile/artifacts
