name: Mobile App CI

on:
  push:
    branches: [main, dev]
    paths:
      - "mobile/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "mobile/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # Clear any restored npm cache corruption that can trigger EEXIST during npm ci on GitHub-hosted runners
      - name: Clean npm cache
        run: rm -rf ~/.npm/_cacache

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx expo-doctor

      # Unit tests + coverage
      - run: npm run test:coverage

      # Upload coverage to Codecov
      - uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          files: mobile/coverage/lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Upload test results to Codecov Test Analytics
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@47f89e9acb64b76debcd5ea40642d25a4adced9f # v1.1.1
        with:
          files: mobile/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      # SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: mobile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}